<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Princy's Birthday Letter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: the tulip page's night (ASCII specks, rising gold fireflies, glow) fixed behind a scrolling letter. Each section is a paragraph in the middle with one photo on its left and one on its right; on phones the photos sit side by side above the paragraph. */
:root {
  --bg: #000000;
  --fg: #f5eee8;
  --pink: #f28bb8;
  --muted: #8f8a9a;
  --line: rgba(245, 238, 232, 0.2);
  --edge: #2a2838;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono: Menlo, Consolas, "DejaVu Sans Mono", "Courier New", monospace;
  color-scheme: dark;
  background: var(--bg);
}
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--mono);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#view { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #000; z-index: 0; }
.page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding-block: 24px 140px; }

/* heading, same type as the tulip page */
.hero { font: 400 clamp(30px, 5.6vw, 45px)/1.05 var(--serif); color: var(--fg); padding-block: 4px 0; }
.hero strong { color: var(--pink); font-weight: normal; font-style: italic; }
.hero span { display: block; margin-top: 0.6rem; font-size: 0.68em; font-style: italic; }

/* sections */
.sec {
  position: relative; display: grid; align-items: center;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr);
  grid-template-areas: "l m r";
  gap: clamp(16px, 4vw, 56px);
  padding-block: clamp(34px, 9vh, 92px);
}
.slot {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; overflow: hidden;
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03);
  box-shadow: 0 0 44px rgba(242, 139, 184, 0.14), 0 12px 40px rgba(0, 0, 0, 0.55);
  transform: rotate(var(--rot, 0deg));
  animation: float 8s ease-in-out infinite; animation-delay: var(--d, 0s);
}
body.editing .slot { animation: none; }
.slot.l { grid-area: l; --rot: -2deg; }
.slot.r { grid-area: r; --rot: 2deg; --d: -3.5s; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--rot)); } 50% { transform: translateY(-6px) rotate(var(--rot)); } }
.slot img { width: 100%; height: 100%; max-width: none; object-fit: cover; display: block; }
.slot.empty { border-style: dashed; }
.slot .hint {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 8px;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(245, 238, 232, 0.34);
}
.slot .pick, .slot .rm { display: none; }
body.editing .slot .pick {
  display: block; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; padding: 0;
  background: transparent; color: var(--fg); font: 12px var(--mono); opacity: 0; cursor: pointer;
}
body.editing .slot.empty .pick, body.editing .slot .pick:hover, body.editing .slot .pick:focus-visible { opacity: 1; }
body.editing .slot .pick:hover { background: rgba(0, 0, 0, 0.5); }
body.editing .slot.empty .hint { display: none; }
body.editing .slot .rm {
  display: block; position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; padding: 0; line-height: 1; z-index: 2;
}
.mid { grid-area: m; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.para {
  margin: 0; max-width: 36ch; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; text-wrap: pretty;
  font: 400 clamp(20px, 2.5vw, 30px)/1.45 var(--serif); color: var(--fg); text-shadow: 0 2px 24px rgba(0, 0, 0, 0.8);
}
.para em { font-style: italic; color: var(--pink); }
.ta, .tip, .tools { display: none; }
body.editing .para { display: none; }
body.editing .ta {
  display: block; width: 100%; box-sizing: border-box; min-height: 170px; resize: vertical;
  background: rgba(7, 7, 11, 0.88); color: var(--fg); border: 1px solid var(--edge); border-radius: 2px;
  padding: 10px; font: 15px/1.6 var(--mono);
}
body.editing .tip { display: block; font-size: 11px; color: var(--muted); text-align: center; }
body.editing .tools { display: flex; position: absolute; top: 0; left: 0; right: 0; justify-content: center; flex-wrap: wrap; gap: 6px; }

/* controls */
button {
  font: 12px var(--mono); color: var(--fg); background: rgba(10, 9, 15, 0.7);
  border: 1px solid var(--edge); border-radius: 2px; padding: 8px 12px; cursor: pointer;
}
button:hover { background: #17151f; border-color: #3b3950; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.top { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.top button { backdrop-filter: blur(6px); opacity: 0.7; }
.top button:hover, .top button:focus-visible, body.editing .top button { opacity: 1; }
.bottom {
  position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
body.editing .bottom { display: flex; }
.bottom button { pointer-events: auto; backdrop-filter: blur(6px); }
.status { margin: 0; min-height: 1.4em; font-size: 12px; color: var(--pink); text-align: center; }

@media (max-width: 720px) {
  .sec { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "l r" "m m"; align-items: start; }
  .hero { padding-right: 72px; }
  .mid { padding-top: 6px; }
  .para { max-width: 30ch; font-size: clamp(21px, 5.6vw, 28px); }
}
@media (prefers-reduced-motion: reduce) { .slot { animation: none; } }

/* Photos as tilted paper-stack frames in a zigzag (left, right, left, right) over the same night background; the letter floats over them as you scroll */
body { overflow-x: clip; }
.sec { display: block; position: relative; min-height: 0; padding-block: 0; }
.bg { position: relative; display: flex; flex-direction: column; padding-block: 8vh 10vh; background: none; }
.bg::after { display: none; }
.sec .slot { width: min(76%, 540px); aspect-ratio: 4 / 3; box-sizing: border-box; overflow: visible; border: 9px solid #ddd3ba; background: #000;
  box-shadow: 7px 7px 0 -1px #c9bfa4, 13px 14px 0 -2px #e8e1cd, 0 18px 36px rgba(0, 0, 0, 0.6); }
.sec .slot + .slot { margin-top: -3vw; }
.sec .slot.l { align-self: flex-start; --rot: -3deg; }
.sec .slot.r { align-self: flex-end; --rot: 3deg; --d: -3.5s; }
.sec .slot.l2 { align-self: flex-start; --rot: -2deg; --d: -1.5s; }
.sec .slot.r2 { align-self: flex-end; --rot: 2.5deg; --d: -5s; }
.slot img { filter: none; }
.slot .hint { display: none; }
.sec .tools { z-index: 4; top: 12px; }
.sec .mid { position: sticky; top: 6vh; height: 0; max-width: none; width: 100%; padding: 0; z-index: 3; pointer-events: none; overflow: visible; }
.sec .para { margin-inline: auto; max-width: min(100%, 500px); max-height: 84vh; overflow-y: auto; scrollbar-width: none; pointer-events: auto; text-align: left; text-wrap: pretty;
  padding: 28px 26px; border-radius: 34px; font-size: clamp(19px, 2.2vw, 25px); line-height: 1.42; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
  background: radial-gradient(130% 70% at 18% 0%, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0) 55%), linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05) 60%, rgba(255, 255, 255, 0.1)), rgba(18, 16, 28, 0.22);
  backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -1px 0 rgba(255, 255, 255, 0.12), inset 0 0 26px rgba(255, 255, 255, 0.08), 0 14px 44px rgba(0, 0, 0, 0.4);
  opacity: 0; transform: translateY(28px); transition: opacity 1s ease, transform 1s ease; }
.sec.in .para { opacity: 1; transform: none; }
body.editing .sec .mid { position: static; height: auto; max-width: 520px; margin: 0 auto 20px; pointer-events: auto; }
@media (max-width: 720px) { .sec .slot { width: 78%; } .sec .para { font-size: 17px; line-height: 1.38; padding: 22px 20px; border-radius: 30px; max-height: 88vh; } }
/* text box grows to fit all its text, centred over the photos (no inner scrolling) */
.sec { display: grid; grid-template-columns: minmax(0, 1fr); }
.sec > .bg, .sec > .mid { grid-area: 1 / 1; }
.sec > .bg { align-self: center; }
.sec .mid { position: relative; z-index: 6; top: auto; height: auto; align-self: center; margin-block: 5vh; }
.sec .para { box-sizing: border-box; width: 100%; max-height: none; overflow: visible; padding: 32px 28px; }
@media (max-width: 720px) {
  .sec .mid { width: calc(100% + 16px); margin-inline: -8px; }
  .sec .para { font-size: 17.5px; line-height: 1.4; padding: 28px 22px; max-height: none; }
}
body.editing .sec { display: block; }
/* no glass box: the photos dim as you scroll in, then the letter glows in word by word */
.sec > .bg { align-self: stretch; justify-content: space-around; }
#dimmer { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: rgba(4, 3, 10, 0.34); opacity: 0; transition: opacity 1.4s ease; }
html.dim #dimmer { opacity: 1; }
body.editing #dimmer { display: none; }
.hero { display: none; }
.sec .para { background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 0; padding: 0 6px; text-shadow: none;
  color: #fff7fb; opacity: 1; transform: none; transition: none; font-size: clamp(23px, 2.8vw, 31px); line-height: 1.5; text-align: center; }
.sec .para .w { display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(8px); }
.sec.in .para .w { animation: wordIn 1s ease forwards; animation-delay: calc(var(--i) * 38ms + 0.6s); }
@keyframes wordIn {
  0% { opacity: 0; filter: blur(8px); transform: translateY(8px); text-shadow: 0 0 0 rgba(255, 255, 255, 0); }
  55% { opacity: 1; filter: blur(0); transform: none; text-shadow: 0 0 12px #fff, 0 0 30px rgba(255, 190, 230, 0.95), 0 0 56px rgba(190, 150, 255, 0.6); }
  100% { opacity: 1; filter: none; transform: none; text-shadow: 0 0 3px rgba(255, 255, 255, 0.95), 0 0 10px rgba(255, 215, 238, 0.85), 0 0 24px rgba(255, 150, 210, 0.75), 0 0 48px rgba(190, 140, 255, 0.6); }
}
@media (max-width: 720px) {
  .sec .mid { width: 100%; margin-inline: 0; }
  .sec .para { font-size: 21.5px; line-height: 1.5; padding: 0 8px; }
}
@media (prefers-reduced-motion: reduce) { .sec .para .w { opacity: 1; filter: none; transform: none; animation: none !important; } }
.sec .para::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: reduce) { .sec .para { opacity: 1; transform: none; transition: none; } }

/* page 1: the ASCII lily bouquet, then scroll down into the letter */
#first { position: relative; z-index: 6; height: 100vh; height: 100dvh; background: #000; overflow: hidden; }
#bq { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
#first .birthday-message { position: absolute; z-index: 1; top: 1rem; left: 1.25rem; right: 1rem; color: #f5eee8; font: 2.8rem "Instrument Serif", serif; line-height: 1.05; pointer-events: none; }
#first .birthday-message strong { color: #f28bb8; font-weight: normal; font-style: italic; }
#first .birthday-message span { display: block; margin-top: 0.6rem; font-size: 0.68em; font-style: italic; }
.cue { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; color: #f5eee8; font: italic 1.25rem "Instrument Serif", serif; opacity: 0.75; pointer-events: none; animation: cue 2.2s ease-in-out infinite; }
.cue i { display: block; font-style: normal; font-size: 1.4rem; line-height: 1; margin-top: 2px; }
@keyframes cue { 0%, 100% { transform: translateY(0); opacity: 0.45; } 50% { transform: translateY(8px); opacity: 0.9; } }
@media (max-width: 720px) { #first .birthday-message { font-size: 2.2rem; } }
</style>

<canvas id="view" aria-hidden="true"></canvas>

<section id="first">
  <div class="birthday-message" aria-label="happiest birthday, princyyyyy, i love you so muchhhh">
    happiest birthday <strong>princyyyyy</strong>,<br>
    <span>i love you so muchhhh</span>
  </div>
  <canvas id="bq" aria-label="ASCII lily bouquet"></canvas>
  <div class="cue" aria-hidden="true">scroll down<i>&#8595;</i></div>
</section>

<main class="page" id="page">
  <header class="hero">
    happiest birthday <strong>princyyyyy</strong>,<br>
    <span>i love you so muchhhh</span>
  </header>
  <div id="sections"></div>
</main>

<div class="top" id="editui"><button id="editBtn" type="button" aria-pressed="false">Edit</button></div>
<div class="bottom" id="bottom">
  <p class="status" id="status" role="status"></p>
  <button id="addSec" type="button">Add another section</button>
</div>
<input id="file" type="file" accept="image/*" multiple hidden>

 person to my heart, and the most gorgeous and lovely person in my life. You're also the most caring and understanding person I know. It's been two years since we met, and I still remember the first time.\n\nI remember how you cursed me when I threw a fish at you in the game, the fun we had in therapy, and the moments we spent together on calls and in games. Thank you for being such a strong support and for being there for me when I needed you the most.\n\nEverything feels so right when you're with me. Your presence fills up the room with light and joyfulness. I can feel the love even when you're mad at me; every curse from your mouth makes me feel loved. I can feel the warmth of your heart when you laugh at me for doing silly things.\n\nSorry for being a pain sometimes, sorry for using such derogatory words, and sorry for being a little bit too much. I hope you know that I love you and care about you so much. I just want you to know that you are loved, even when you're not with me.\n\nThis distance between us has made you suffer, but I hope you know that I will always be there for you. I will make sure that the distance between us ends soon, and we will be together very soon.\n\nOnce again I wish you a very happy birthday Pixyyy, may all your dreams come true and may you have a wonderful year ahead filled with love, happiness, and success. I love you so much and I wish we could celebrate this special day together.", "l": "p1", "r": "p2", "l2": "p3", "r2": "p4"}]};

    const breathe = BREATH_DEPTH * (0.5 - 0.5 * Math.cos(TAU * (t - f.tOpen - 3) / BREATH + i * 0.9))
      * smoothstep(f.tOpen + 1.6, f.tOpen + 3, t);
    const openness = opening * (1 - breathe);
    const s = f.size * settings.size * (0.35 + 0.65 * swell) * (0.5 + 0.5 * Math.max(openness, ripe * 0.6));
    lily(f.pos, f.axis, s, openness, ripe, t, i * 7 + 3, PALETTES[f.col], f.bright);
  });
  BUDS.forEach((b, i) => {                                                 // Buds
    if (t < b.end) return;
    const swell = smoothstep(b.end, b.end + 0.6, t);
    lily(b.pos, b.axis, b.size * (0.4 + 0.6 * swell), 0.04 + 0.03 * wave(t, 2, i),
      b.ripe * swell, t, 90 + i, PALETTES[b.col], 0.9);
  });

  const pv = 0.5 * smoothstep(3, 4.5, t), off = Math.floor(t * 4);       // Gold specks slowly rise like fireflies
  if (pv > 0) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c;
    if (lum[i] < 0.1 && hash3(c, r + off, 77) % 1000 < 2) set(i, pv, 1, 0.8, 0.4);
  }
  fireflies(t);
  const fade = smoothstep(0, 0.2, t);
  if (fade < 1) for (let i = 0; i < N; i++) lum[i] *= fade;
}

// ================================================================ Characters -> image
const view = document.getElementById("bq"), ctx = view.getContext("2d");
const W = COLS * CW, H = ROWS * CH;
view.width = W; view.height = H;
const CHARS = BUCKETS.join(""), START = [], COUNT = BUCKETS.map((b) => b.length);
BUCKETS.reduce((s, b, k) => { START[k] = s; return s + b.length; }, 0);
const MASKS = [...CHARS].map((ch) => {                                     // Render and cache character masks
  const g = document.createElement("canvas"); g.width = CW; g.height = CH;
  const gx = g.getContext("2d");
  gx.font = FONT; gx.textBaseline = "top"; gx.fillStyle = "#fff"; gx.fillText(ch, 0, 0);
  const d = gx.getImageData(0, 0, CW, CH).data, m = new Uint8Array(CW * CH);
  for (let k = 0; k < m.length; k++) m[k] = d[k * 4 + 3];
  return m;
});
const ascii = document.createElement("canvas"); ascii.width = W; ascii.height = H;   // Character layer (transparent background)
const actx = ascii.getContext("2d");
const img = actx.createImageData(W, H), px = img.data, px32 = new Uint32Array(px.buffer);

const glowA = document.createElement("canvas"), glowB = document.createElement("canvas"), glowC = document.createElement("canvas");
[[glowA, 2], [glowB, 4], [glowC, 8]].forEach(([g, s]) => { g.width = Math.ceil(W / s); g.height = Math.ceil(H / s); });

function draw(frame, t) {
  px32.fill(0);
  const fidx = Math.floor(frame / 3);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c, L = lum[i];
    let level = 0;
    while (level < LEVELS.length && L >= LEVELS[level]) level++;
    if (level === 0) continue;
    const ch = START[level] + hash3(r, c, fidx) % COUNT[level], m = MASKS[ch];
    const k = (0.45 + 0.75 * L) * 1.6 / 255 * 255, j = i * 3;
    const R = rgb[j] * k, G = rgb[j + 1] * k, B = rgb[j + 2] * k;
    let o0 = (r * CH) * W + c * CW, mi = 0;
    for (let y = 0; y < CH; y++, o0 += W) {               // Write pixel by pixel (four bytes at once)
      for (let x = 0; x < CW; x++, mi++) {
        const v = m[mi];
        if (v) {
          const pr = Math.min(255, 255 * R) | 0, pg = Math.min(255, 255 * G) | 0, pb = Math.min(255, 255 * B) | 0;
          px32[o0 + x] = (v << 24) | (pb << 16) | (pg << 8) | pr;     // Opacity = character stroke thickness
        }
      }
    }
  }
  actx.putImageData(img, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(ascii, 0, 0);
  if (settings.glow > 0) {                                                 // Glow around flowers: shrink the image by half repeatedly, then overlay it
    let src = ascii;
    for (const g of [glowA, glowB, glowC]) {
      const gx = g.getContext("2d");
      gx.imageSmoothingEnabled = true; gx.clearRect(0, 0, g.width, g.height);
      gx.drawImage(src, 0, 0, g.width, g.height); src = g;
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = Math.min(1, settings.glow);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(glowC, 0, 0, W, H);
    if (settings.glow > 1) { ctx.globalAlpha = settings.glow - 1; ctx.drawImage(glowC, 0, 0, W, H); }
    ctx.restore();
  }
}

// ================================================================ Playback
let t0 = performance.now(), lastDraw = -1e9;
let bqOn = true;
new IntersectionObserver(function (e) { bqOn = e[0].isIntersecting; }).observe(document.getElementById("first"));
function tick(now) {
  if (!bqOn) { requestAnimationFrame(tick); return; }
  if (now - lastDraw >= 1000 / FPS - 2) {
    lastDraw = now;
    const t = (now - t0) / 1000;
    scene(t);
    draw(Math.floor(t * FPS), t);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// If the window aspect ratio changes significantly, reload to keep the image filling the screen
let resizeTimer = 0;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const want = Math.max(150, Math.min(640, Math.round(ROWS * CH / CW * innerWidth / Math.max(1, innerHeight))));
    
  }, 400);
});

})();
</script>
</body>
